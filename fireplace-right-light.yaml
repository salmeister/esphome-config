substitutions:
  devicename: fireplace-right-light
  shortname: "Fireplace Right"
  fullname: "Fireplace Right Light"
  ipPrefix:  !secret ip_prefix
  id: "67"

<<: !include base.yaml

bk72xx:
  board: generic-bk7231n-qfn32-tuya

light:
  - platform: rgbww
    id: downlight
    name: ${shortname}
    color_interlock: true
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
    red: output_red
    green: output_green
    blue: output_blue
    cold_white: output_cold
    warm_white: output_warm
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

output:
  - platform: libretiny_pwm
    id: output_red
    pin: P8
  - platform: libretiny_pwm
    id: output_green
    pin: P7
  - platform: libretiny_pwm
    id: output_blue
    pin: P6
  - platform: libretiny_pwm
    id: output_cold
    pin: P26
  - platform: libretiny_pwm
    id: output_warm
    pin: P24