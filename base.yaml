esphome:
  name: ${devicename}
  comment: ${ipPrefix}.${id}
  build_flags:
    - "-DMBED_CONF_LWIP_TCP_MSS=1460"
  platformio_options:
    lib_ignore:
      - RPAsyncTCP

wifi:
  ap:
    ssid: ${fullname} AP
    password: !secret fallback_psswd
  networks:
    ssid: "SALNET_IoT"
    password: !secret iot_psswd
    manual_ip:
      static_ip: "${ipPrefix}.${id}"
      gateway: !secret iot_gateway
      subnet: !secret subnet
  use_address: "${ipPrefix}.${id}"
  fast_connect: true
  reboot_timeout: 15min

captive_portal:

logger:

ota:
  - platform: esphome
    password: !secret ota_psswd

#web_server: 

api:
  encryption:
    key: !secret esphome_encryption_key 
  reboot_timeout: 0s

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address: ${fullname}"
    mac_address:
      name: "MAC Address: ${fullname}"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB: ${fullname}"
    id: "manual_id_wifi_signal_db"
    update_interval: 15min
    entity_category: "diagnostic"

button:
  - platform: restart
    name: "Restart: ${fullname}"
    entity_category: "config"
  - platform: safe_mode
    name: "Restart (Safe Mode): ${fullname}"
    entity_category: "diagnostic"